name: Apply Review editor focus integration

on:
  push:
    branches: [feature/review-to-editor-focus-v1]
    paths:
      - .github/workflows/apply-review-editor-focus.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/review-to-editor-focus-v1
      - name: Apply focused Review-to-editor integration
        run: python tooling/apply-review-editor-focus.py
      - name: Remove one-shot patch machinery
        run: rm .github/workflows/apply-review-editor-focus.yml tooling/apply-review-editor-focus.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/FloorPlanImageDialog.svelte src/routes/editor/+page.svelte src/lib/components/editor/FloorPlanCanvas.svelte .github/workflows/apply-review-editor-focus.yml tooling/apply-review-editor-focus.py
          git commit -m "Integrate Review finding editor focus"
          git push origin HEAD:feature/review-to-editor-focus-v1
