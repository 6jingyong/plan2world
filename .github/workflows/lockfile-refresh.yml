name: Lockfile refresh

on:
  push:
    branches:
      - feature/game-piece-furniture-v2

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Add patched transitive dependency floors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...p.overrides,
            '@grpc/grpc-js': '1.14.5',
            devalue: '5.9.3',
            dompurify: '3.4.16',
            'source-map-js': '1.2.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, '\t') + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Verify generated lockfile installs cleanly
        run: npm ci --ignore-scripts
      - name: Capture audit result
        run: npm audit --audit-level=high > audit.txt 2>&1 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-lockfile
          path: |
            package.json
            package-lock.json
            audit.txt
          retention-days: 1
