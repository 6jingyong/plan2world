name: Lockfile refresh

on:
  push:
    branches:
      - feature/game-piece-furniture-v2

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'pin patched transitive dependencies') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Add patched transitive dependency floors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...p.overrides,
            '@grpc/grpc-js': '1.14.5',
            devalue: '5.9.3',
            dompurify: '3.4.16',
            'source-map-js': '1.2.2'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, '\t') + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Verify generated dependency tree
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit validated dependency floors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin patched transitive dependencies"
            git push origin HEAD:feature/game-piece-furniture-v2
          fi
