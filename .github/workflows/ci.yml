name: Web checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lockfile-refresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - run: npm run catalog:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Production build for browser regressions
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - run: npm audit --audit-level=high

  # Full browser regression is useful after code reaches main, but it is too
  # expensive and flaky to gate every small PR. Pull requests already run the
  # deterministic type/unit/build checks above.
  browser:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Chromium and WebKit regressions
        if: matrix.browser != 'firefox'
        run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/6
      - name: Firefox regressions with a virtual display for WebGL
        if: matrix.browser == 'firefox'
        run: xvfb-run -a npm run test:browser -- --project=firefox --headed --shard=${{ matrix.shard }}/6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Rendering benchmarks are trend checks, not correctness gates for a PR.
  benchmark:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, phone-viewport]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:viewer -- --project=${{ matrix.profile }}
      - name: Rendering measurements and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendering-benchmarks-${{ matrix.profile }}
          path: benchmark-results/
          retention-days: 3

  check:
    if: ${{ always() }}
    needs: [build, audit, browser, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require PR core checks; require full suite on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$AUDIT_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$BROWSER_RESULT" = success
            test "$BENCHMARK_RESULT" = success
          fi
