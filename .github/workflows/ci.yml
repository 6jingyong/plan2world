name: Core checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - run: npm run catalog:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Production build for browser regressions
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - run: npm audit --audit-level=high

  # Runtime is now a first-class output. Keep this small and deterministic: use
  # the exact supported Godot build, verify its checksum, parse/import the
  # project, then boot the built-in compiled-runtime demo headlessly.
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Parse and import Godot project
        run: |
          "$GODOT_BIN" --headless --path runtime/godot --editor --quit
      - name: Boot built-in runtime demo
        run: |
          "$GODOT_BIN" --headless --path runtime/godot --quit-after 5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - name: Export native Project and verify packaged assets in Godot
        run: |
          node tooling/runtime-asset-fixture.mjs /tmp/runtime-assets
          "$GODOT_BIN" --headless --path runtime/godot --script res://tests/runtime_assets_test.gd -- --scene /tmp/runtime-assets/assets.runtime.json


  # Full browser regression is useful after code reaches main, but it is too
  # expensive and flaky to gate every PR. Pull requests already run the
  # deterministic type/unit/build checks above plus the headless runtime check.
  browser:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Chromium and WebKit regressions
        if: matrix.browser != 'firefox'
        run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/6
      - name: Firefox regressions with a virtual display for WebGL
        if: matrix.browser == 'firefox'
        run: xvfb-run -a npm run test:browser -- --project=firefox --headed --shard=${{ matrix.shard }}/6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Rendering benchmarks are trend checks, not correctness gates for a PR.
  benchmark:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, phone-viewport]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:viewer -- --project=${{ matrix.profile }}
      - name: Rendering measurements and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendering-benchmarks-${{ matrix.profile }}
          path: benchmark-results/
          retention-days: 3

  check:
    if: ${{ always() }}
    needs: [build, audit, godot, browser, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require PR core checks; require full suite on main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          GODOT_RESULT: ${{ needs.godot.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$GODOT_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$BROWSER_RESULT" = success
            test "$BENCHMARK_RESULT" = success
          fi
