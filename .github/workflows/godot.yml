name: Godot runtime checks

on:
  push:
    branches: [main]
    paths:
      - 'runtime/godot/**'
      - 'src/lib/runtime/**'
      - '.github/workflows/godot.yml'
  pull_request:
    paths:
      - 'runtime/godot/**'
      - 'src/lib/runtime/**'
      - '.github/workflows/godot.yml'

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Parse and import Godot project
        run: "$GODOT_BIN" --headless --path runtime/godot --editor --quit
      - name: Boot built-in runtime demo
        run: "$GODOT_BIN" --headless --path runtime/godot --quit-after 5
