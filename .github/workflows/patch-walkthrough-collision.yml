name: Patch walkthrough collision wiring

on:
  push:
    branches: [feature/walkthrough-collision-v1]
    paths: [.github/workflows/patch-walkthrough-collision.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/walkthrough-collision-v1
      - name: Wire cached collision world into ThreeViewer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/components/viewer3d/ThreeViewer.svelte')
          text = path.read_text()
          replacements = [
            (
              "  import { WalkthroughMotion } from '$lib/utils/walkthroughMotion';\n",
              "  import { WalkthroughMotion } from '$lib/utils/walkthroughMotion';\n  import { createWalkthroughCollisionWorld, type WalkthroughCollisionWorld } from '$lib/utils/walkthroughCollision';\n",
            ),
            (
              "  const walkthroughMotion = new WalkthroughMotion();\n",
              "  const walkthroughMotion = new WalkthroughMotion();\n  let walkthroughCollisionWorld: WalkthroughCollisionWorld | null = null;\n",
            ),
            (
              "      currentFloor = f;\n      if (f) rebuildScene();\n",
              "      currentFloor = f;\n      walkthroughCollisionWorld = f ? createWalkthroughCollisionWorld(f) : null;\n      if (f) rebuildScene();\n",
            ),
            (
              "      walkthroughMotion.advance(timestamp, camera, { moveSpeed, sprintSpeed, eyeHeight, floorElevation: activeFloorElevation });\n",
              "      walkthroughMotion.advance(timestamp, camera, {\n        moveSpeed, sprintSpeed, eyeHeight, floorElevation: activeFloorElevation,\n        collisionWorld: walkthroughCollisionWorld,\n      });\n",
            ),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old!r}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/lib/components/viewer3d/ThreeViewer.svelte
      - name: Commit viewer wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/components/viewer3d/ThreeViewer.svelte
          git commit -m "Wire walkthrough collision into 3D viewer"
          git push origin HEAD:feature/walkthrough-collision-v1
