name: Apply architectural cut integration

on:
  push:
    branches: [feature/architectural-cut-view-v1]
    paths:
      - .github/workflows/apply-architectural-cut.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/architectural-cut-view-v1
      - name: Apply focused viewer integration
        run: python tooling/apply-architectural-cut.py
      - name: Remove one-shot patch machinery
        run: rm .github/workflows/apply-architectural-cut.yml tooling/apply-architectural-cut.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/viewer3d/ThreeViewer.svelte .github/workflows/apply-architectural-cut.yml tooling/apply-architectural-cut.py
          git commit -m "Integrate 1.20 m architectural cut view"
          git push origin HEAD:feature/architectural-cut-view-v1
